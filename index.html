<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f4f7fb, #dfe9f3);
      transition: background 0.2s ease;
    }

    body.dark-mode {
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    .calculator {
      width: 320px;
      background: #1f2937;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      transition: background 0.2s ease;
    }

    body.dark-mode .calculator {
      background: #111827;
    }

    .display {
      width: 100%;
      height: 70px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 2rem;
      text-align: right;
      padding: 15px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    body.dark-mode .display {
      background: #030712;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .scientific-buttons {
      margin-bottom: 10px;
    }

    .scientific-buttons[hidden] {
      display: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 18px 0;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .operator {
      background: #f59e0b;
      color: white;
    }

    .number {
      background: #e5e7eb;
      color: #111827;
    }

    body.dark-mode .number {
      background: #475569;
      color: white;
    }

    .clear {
      background: #ef4444;
      color: white;
    }

    .equal {
      background: #10b981;
      color: white;
      grid-column: span 2;
    }

    .scientific-button {
      background: #475569;
      color: white;
      font-size: 0.95rem;
    }

    .mode-controls {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 10px;
    }

    .mode-toggle,
    .theme-toggle {
      border: none;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 360px) {
      .calculator {
        width: calc(100vw - 32px);
      }

      .mode-controls {
        right: 10px;
        bottom: 10px;
        gap: 8px;
      }

      .mode-toggle,
      .theme-toggle {
        padding: 11px 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <input
      class="display"
      id="display"
      type="text"
      readonly
      aria-label="Calculator display"
    />

    <div class="buttons scientific-buttons" id="scientificButtons" hidden>
      <button class="scientific-button" data-value="sin(">sin</button>
      <button class="scientific-button" data-value="cos(">cos</button>
      <button class="scientific-button" data-value="tan(">tan</button>
      <button class="scientific-button" data-value="sqrt(">√</button>

      <button class="scientific-button" data-value="log(">log</button>
      <button class="scientific-button" data-value="ln(">ln</button>
      <button class="scientific-button" data-value="^2">x²</button>
      <button class="scientific-button" data-value="^">xʸ</button>

      <button class="scientific-button" data-value="(">(</button>
      <button class="scientific-button" data-value=")">)</button>
      <button class="scientific-button" data-value="π">π</button>
      <button class="scientific-button" data-value="e">e</button>
    </div>

    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>
      <button class="operator" data-action="backspace">⌫</button>

      <button class="number" data-value="7">7</button>
      <button class="number" data-value="8">8</button>
      <button class="number" data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button class="number" data-value="4">4</button>
      <button class="number" data-value="5">5</button>
      <button class="number" data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button class="number" data-value="1">1</button>
      <button class="number" data-value="2">2</button>
      <button class="number" data-value="3">3</button>
      <button class="equal" data-action="calculate">=</button>

      <button class="number" data-value="0" style="grid-column: span 2;">0</button>
      <button class="number" data-value=".">.</button>
    </div>
  </main>

  <div class="mode-controls">
    <button class="mode-toggle" id="modeToggle" aria-pressed="false">
      Scientific
    </button>
    <button class="theme-toggle" id="themeToggle" aria-pressed="false">
      Dark mode
    </button>
  </div>

  <script>
    const display = document.getElementById("display");
    const scientificButtons = document.getElementById("scientificButtons");
    const modeToggle = document.getElementById("modeToggle");
    const themeToggle = document.getElementById("themeToggle");

    function appendValue(value) {
      if (display.value === "Error") display.value = "";
      display.value += value;
    }

    function clearDisplay() {
      display.value = "";
    }

    function backspace() {
      display.value = display.value === "Error"
        ? ""
        : display.value.slice(0, -1);
    }

    function calculateResult() {
      try {
        let expression = display.value
          .replaceAll("×", "*")
          .replaceAll("÷", "/")
          .replaceAll("π", "Math.PI")
          .replace(/\be\b/g, "Math.E")
          .replace(/\bsin\(/g, "Math.sin(")
          .replace(/\bcos\(/g, "Math.cos(")
          .replace(/\btan\(/g, "Math.tan(")
          .replace(/\bsqrt\(/g, "Math.sqrt(")
          .replace(/\blog\(/g, "Math.log10(")
          .replace(/\bln\(/g, "Math.log(")
          .replaceAll("^", "**");

        const checkedExpression = expression
          .replace(/Math\.(sin|cos|tan|sqrt|log10|log|PI|E)/g, "");

        if (!/^[0-9+\-*/().\s]*$/.test(checkedExpression)) {
          throw new Error("Invalid expression");
        }

        const result = Function(`"use strict"; return (${expression})`)();
        display.value = Number.isFinite(result) ? String(result) : "Error";
      } catch {
        display.value = "Error";
      }
    }

    document.querySelector(".calculator").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.action === "clear") clearDisplay();
      else if (button.dataset.action === "backspace") backspace();
      else if (button.dataset.action === "calculate") calculateResult();
      else if (button.dataset.value) appendValue(button.dataset.value);
    });

    modeToggle.addEventListener("click", () => {
      const showScientific = scientificButtons.hidden;
      scientificButtons.hidden = !showScientific;
      modeToggle.textContent = showScientific ? "Standard" : "Scientific";
      modeToggle.setAttribute("aria-pressed", String(showScientific));
    });

    themeToggle.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark-mode");
      themeToggle.textContent = isDark ? "Light mode" : "Dark mode";
      themeToggle.setAttribute("aria-pressed", String(isDark));
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9.+\-*/()]$/.test(event.key)) appendValue(event.key);
      else if (event.key === "Enter" || event.key === "=") calculateResult();
      else if (event.key === "Backspace") backspace();
      else if (event.key === "Escape") clearDisplay();
    });
  </script>
</body>
</html>
